<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automatizador de Programas</title>
  <style>
    :root {
      --bg: #0b0b12;
      --bg2: #11111b;
      --card: #181825;
      --card-hover: #202035;
      --border: #2a2a40;
      --text: #f8f8f2;
      --muted: #a6a6b8;
      --purple: #bd93f9;
      --purple-dark: #9b6de0;
      --pink: #ff79c6; 
      --cyan: #8be9fd;
      --green: #50fa7b;
      --red: #ff5555;
      --yellow: #f1fa8c;
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: 
        radial-gradient(circle at 10% 10%, rgba(189, 147, 249, 0.14), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(255, 121, 198, 0.09), transparent 30%),
        linear-gradient(135deg, var(--bg), var(--bg2));
      padding: 40px 20px;
    }

    .container {
      width: min(1100px, 100%);
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 42px;
    }

    .logo {
      width: 70px;
      height: 70px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: #15121e;
      font-size: 32px;
      box-shadow: 0 15px 45px rgba(189, 147, 249, 0.25);
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -1.5px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 18px;
      padding: 8px 15px;
      border-radius: 999px;
      background: rgba(80, 250, 123, 0.07);
      border: 1px solid rgba(80, 250, 123, 0.18);
      color: var(--green);
      font-size: 0.82rem;
    }

    .status.error {
      color: var(--red);
      background: rgba(255, 85, 85, 0.07);
      border-color: rgba(255, 85, 85, 0.18);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 10px currentColor;
    }

    .directories {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 18px;
    }

    .directory {
      position: relative;
      padding: 22px;
      background: rgba(24, 24, 37, 0.88);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px);
      transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    .directory:hover {
      transform: translateY(-5px);
      background: rgba(32, 32, 53, 0.95);
      border-color: rgba(189, 147, 249, 0.45);
      box-shadow: 0 25px 55px rgba(0, 0, 0, 0.48);
    }

    .folder {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .folder-icon {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: rgba(189, 147, 249, 0.12);
      color: var(--purple);
      font-size: 23px;
    }

    .folder-info {
      min-width: 0;
    }

    .folder-name {
      font-size: 1.08rem;
      font-weight: 750;
      word-break: break-word;
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .info-box {
      min-width: 0;
      padding: 12px;
      border-radius: 14px;
      background: rgba(11, 11, 18, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .label {
      color: var(--muted);
      font-size: 0.7rem;
      margin-bottom: 5px;
    }

    .value {
      color: var(--text);
      font-size: 0.83rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .download {
      width: 100%;
      border: none;
      padding: 13px 18px;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--purple), var(--purple-dark));
      color: #17131f;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .download:hover:not(:disabled) {
      transform: scale(1.02);
      box-shadow: 0 10px 30px rgba(189, 147, 249, 0.28);
    }

    .download:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .loading, .error, .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 70px 20px;
      color: var(--muted);
    }

    .loading-title {
      color: var(--text);
      font-size: 1.1rem;
      margin-bottom: 7px;
    }

    .spinner {
      width: 38px;
      height: 38px;
      margin: 0 auto 18px;
      border: 3px solid var(--border);
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error h2 {
      color: var(--red);
      margin-bottom: 10px;
    }

    .error p {
      line-height: 1.6;
    }

    footer {
      text-align: center;
      color: #5f5f72;
      font-size: 0.72rem;
      margin-top: 40px;
    }

    @media (max-width: 600px) {
      body { padding: 25px 14px; }
      header { margin-bottom: 30px; }
      .directories { grid-template-columns: 1fr; }
      .directory { padding: 18px; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>

<main class="container">
  <header>
    <div class="logo">📁</div>
    <h1>Automatizador de programas</h1>
    <p class="subtitle">
      Explora y descarga las carpetas de versiones.<br>
      SOLO DISPONIBLE PARA PC
    </p>
    <div class="status" id="statusContainer">
      <span class="status-dot"></span>
      <span id="status">Conectando con GitHub...</span>
    </div>
  </header>

  <section id="directories" class="directories">
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-title">Escaneando repositorio...</div>
      <div>Buscando carpetas de versiones</div>
    </div>
  </section>

  <footer>
    Automatizador · Dracula Dark UI
  </footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const container = document.getElementById("directories");
const statusText = document.getElementById("status");
const statusContainer = document.getElementById("statusContainer");

// Detectar automáticamente usuario y repositorio de GitHub Pages
const hostname = window.location.hostname;
const pathname = window.location.pathname;

let owner = "zarinche"; // Tu usuario predeterminado
let repo = "zarinche.github.io"; // Tu repositorio predeterminado

if (hostname.endsWith(".github.io")) {
  owner = hostname.split(".")[0];
  const segments = pathname.split("/").filter(Boolean);
  repo = segments.length > 0 ? segments[0] : `${owner}.github.io`;
}

function formatBytes(bytes) {
  if (!Number.isFinite(bytes) || bytes <= 0) return "0 B";
  const units = ["B", "KB", "MB", "GB", "TB"];
  const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
  return (bytes / Math.pow(1024, index)).toFixed(index === 0 ? 0 : 1) + " " + units[index];
}

function escapeHTML(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

// Escanear recursivamente el contenido de una carpeta en GitHub
async function getFolderContents(currentPath = "") {
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${currentPath}`;
  const response = await fetch(apiUrl);
  if (!response.ok) throw new Error(`No se pudo acceder a la ruta: ${currentPath}`);
  
  const items = await response.json();
  let files = [];
  let totalSize = 0;

  for (const item of items) {
    if (item.type === "file") {
      files.push({
        name: item.name,
        path: item.path,
        // Ruta relativa manteniendo la estructura interna de la carpeta
        relativePath: item.path.split("/").slice(1).join("/"), 
        downloadUrl: item.download_url,
        size: item.size
      });
      totalSize += item.size;
    } else if (item.type === "dir") {
      const subFolder = await getFolderContents(item.path);
      files = files.concat(subFolder.files);
      totalSize += subFolder.size;
    }
  }

  return { files, size: totalSize };
}

async function downloadFolder(event, directory) {
  const button = event.currentTarget;
  const originalText = button.textContent;
  button.disabled = true;

  try {
    button.textContent = "Obteniendo archivos...";
    const folderData = await getFolderContents(directory.name);

    if (!folderData.files.length) {
      throw new Error("La carpeta está vacía.");
    }

    const zip = new JSZip();
    const files = folderData.files;
    const concurrency = 5;

    for (let i = 0; i < files.length; i += concurrency) {
      const batch = files.slice(i, i + concurrency);
      button.textContent = `Descargando ${Math.min(i + batch.length, files.length)}/${files.length}...`;

      await Promise.all(
        batch.map(async file => {
          const res = await fetch(file.downloadUrl);
          if (!res.ok) throw new Error(`Error al descargar ${file.name}`);
          const blob = await res.blob();
          zip.file(file.relativePath, blob);
        })
      );
    }

    button.textContent = "Comprimiendo ZIP...";

    const zipBlob = await zip.generateAsync(
      {
        type: "blob",
        compression: "DEFLATE",
        compressionOptions: { level: 6 }
      },
      metadata => {
        button.textContent = `Comprimiendo ${Math.round(metadata.percent)}%...`;
      }
    );

    const url = URL.createObjectURL(zipBlob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `${directory.name}.zip`;
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 2000);

  } catch (error) {
    console.error(error);
    alert("No se pudo completar la descarga:\n\n" + error.message);
  } finally {
    button.disabled = false;
    button.textContent = originalText;
  }
}

function createCard(dir, folderData) {
  const card = document.createElement("article");
  card.className = "directory";

  const directoryObj = { name: dir.name };

  card.innerHTML = `
    <div class="folder">
      <div class="folder-icon">📦</div>
      <div class="folder-info">
        <div class="folder-name">${escapeHTML(dir.name)}</div>
      </div>
    </div>

    <div class="info">
      <div class="info-box">
        <div class="label">Estado</div>
        <div class="value">Disponible</div>
      </div>

      <div class="info-box">
        <div class="label">Peso</div>
        <div class="value">${formatBytes(folderData.size)}</div>
      </div>

      <div class="info-box">
        <div class="label">Archivos</div>
        <div class="value">${folderData.files.length}</div>
      </div>

      <div class="info-box">
        <div class="label">Tipo</div>
        <div class="value">Carpeta ZIP</div>
      </div>
    </div>

    <button class="download" type="button">
      ↓ Descargar ${escapeHTML(dir.name)}
    </button>
  `;

  card.querySelector(".download").addEventListener("click", event => {
    downloadFolder(event, directoryObj);
  });

  return card;
}

async function init() {
  try {
    // Obtener la raíz del repositorio de GitHub
    const rootUrl = `https://api.github.com/repos/${owner}/${repo}/contents/`;
    const response = await fetch(rootUrl);
    if (!response.ok) throw new Error("No se pudo conectar con el repositorio.");
    
    const items = await response.json();
    
    // Filtrar únicamente carpetas que empiecen con V o v (V1, V2, V3...) y excluir carpetas ocultas
    const folders = items.filter(item => item.type === "dir" && /^v\d+/i.test(item.name));
    
    // Ordenar lógicamente (V1, V2, V3...)
    folders.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

    if (!folders.length) {
      container.innerHTML = `
        <div class="empty">
          <h2>No se encontraron carpetas V1, V2...</h2>
          <p style="margin-top:10px">Asegúrate de subir tus carpetas de versiones a la raíz de tu repositorio.</p>
        </div>
      `;
      statusText.textContent = "0 carpetas detectadas";
      return;
    }

    statusText.textContent = `${folders.length} carpetas detectadas`;
    container.innerHTML = "";

    // Cargar información rápida de cada carpeta para mostrar su peso y número de archivos
    for (const folder of folders) {
      const folderData = await getFolderContents(folder.name);
      container.appendChild(createCard(folder, folderData));
    }

  } catch (error) {
    console.error(error);
    statusText.textContent = "Error de conexión";
    statusContainer.classList.add("error");
    container.innerHTML = `
      <div class="error">
        <h2>No se pudo escanear el repositorio</h2>
        <p>${escapeHTML(error.message)}</p>
        <p style="margin-top:15px">Verifica que tu repositorio de GitHub sea público.</p>
      </div>
    `;
  }
}

init();
</script>

</body>
</html>
