<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automatizador</title>
  <style>
    :root {
      --bg: #0b0b12;
      --bg2: #11111b;
      --card: #181825;
      --card-hover: #202035;
      --border: #2a2a40;
      --text: #f8f8f2;
      --muted: #a6a6b8;
      --purple: #bd93f9;
      --purple-dark: #9b6de0;
      --pink: #ff79c6;
      --cyan: #8be9fd;
      --green: #50fa7b;
      --red: #ff5555;
      --yellow: #f1fa8c;
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: 
        radial-gradient(circle at 10% 10%, rgba(189, 147, 249, 0.14), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(255, 121, 198, 0.09), transparent 30%),
        linear-gradient(135deg, var(--bg), var(--bg2));
      padding: 40px 20px;
    }

    .container {
      width: min(1100px, 100%);
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 42px;
    }

    .logo {
      width: 70px;
      height: 70px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: #15121e;
      font-size: 32px;
      box-shadow: 0 15px 45px rgba(189, 147, 249, 0.25);
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -1.5px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 18px;
      padding: 8px 15px;
      border-radius: 999px;
      background: rgba(80, 250, 123, 0.07);
      border: 1px solid rgba(80, 250, 123, 0.18);
      color: var(--green);
      font-size: 0.82rem;
    }

    .status.error {
      color: var(--red);
      background: rgba(255, 85, 85, 0.07);
      border-color: rgba(255, 85, 85, 0.18);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 10px currentColor;
    }

    .directories {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 18px;
    }

    .directory {
      position: relative;
      padding: 22px;
      background: rgba(24, 24, 37, 0.88);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px);
      transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    .directory:hover {
      transform: translateY(-5px);
      background: rgba(32, 32, 53, 0.95);
      border-color: rgba(189, 147, 249, 0.45);
      box-shadow: 0 25px 55px rgba(0, 0, 0, 0.48);
    }

    .folder {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .folder-icon {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: rgba(189, 147, 249, 0.12);
      color: var(--purple);
      font-size: 23px;
    }

    .folder-info {
      min-width: 0;
    }

    .folder-name {
      font-size: 1.08rem;
      font-weight: 750;
      word-break: break-word;
    }

    .folder-path {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.75rem;
      word-break: break-all;
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .info-box {
      min-width: 0;
      padding: 12px;
      border-radius: 14px;
      background: rgba(11, 11, 18, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .label {
      color: var(--muted);
      font-size: 0.7rem;
      margin-bottom: 5px;
    }

    .value {
      color: var(--text);
      font-size: 0.83rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .download {
      width: 100%;
      border: none;
      padding: 13px 18px;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--purple), var(--purple-dark));
      color: #17131f;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .download:hover:not(:disabled) {
      transform: scale(1.02);
      box-shadow: 0 10px 30px rgba(189, 147, 249, 0.28);
    }

    .download:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .loading, .error, .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 70px 20px;
      color: var(--muted);
    }

    .loading-title {
      color: var(--text);
      font-size: 1.1rem;
      margin-bottom: 7px;
    }

    .spinner {
      width: 38px;
      height: 38px;
      margin: 0 auto 18px;
      border: 3px solid var(--border);
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error h2 {
      color: var(--red);
      margin-bottom: 10px;
    }

    .error p {
      line-height: 1.6;
    }

    footer {
      text-align: center;
      color: #5f5f72;
      font-size: 0.72rem;
      margin-top: 40px;
    }

    @media (max-width: 600px) {
      body { padding: 25px 14px; }
      header { margin-bottom: 30px; }
      .directories { grid-template-columns: 1fr; }
      .directory { padding: 18px; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>

<main class="container">
  <header>
    <div class="logo">📁</div>
    <h1>Automatizador de programas</h1>
    <p class="subtitle">
      Explora y descarga las versiones que más te agraden.<br>
      SOLO DISPONIBLE PARA PC
    </p>
    <div class="status" id="statusContainer">
      <span class="status-dot"></span>
      <span id="status">Cargando repositorio...</span>
    </div>
  </header>

  <section id="directories" class="directories">
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-title">Detectando directorios...</div>
      <div>Cargando catálogo</div>
    </div>
  </section>

  <footer>
    Automatizador · Dracula Dark UI
  </footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const container = document.getElementById("directories");
const statusText = document.getElementById("status");
const statusContainer = document.getElementById("statusContainer");

async function loadManifest() {
  const url = `manifest.json?v=${Date.now()}`;
  const response = await fetch(url, { cache: "no-store" });
  if (!response.ok) {
    throw new Error(`No se pudo cargar manifest.json (${response.status})`);
  }
  return response.json();
}

function formatBytes(bytes) {
  if (!Number.isFinite(bytes) || bytes <= 0) return "0 B";
  const units = ["B", "KB", "MB", "GB", "TB"];
  const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
  return (bytes / Math.pow(1024, index)).toFixed(index === 0 ? 0 : 1) + " " + units[index];
}

function escapeHTML(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

async function downloadFolder(event, directory) {
  const button = event.currentTarget;
  const originalText = button.textContent;
  button.disabled = true;

  try {
    if (!directory.files || !directory.files.length) {
      throw new Error("La carpeta está vacía.");
    }

    const zip = new JSZip();
    const files = directory.files;
    const concurrency = 6;

    for (let i = 0; i < files.length; i += concurrency) {
      const batch = files.slice(i, i + concurrency);
      button.textContent = `Descargando ${Math.min(i + batch.length, files.length)}/${files.length}...`;

      await Promise.all(
        batch.map(async file => {
          const response = await fetch(file.url);
          if (!response.ok) {
            throw new Error(`No se pudo descargar: ${file.path}`);
          }
          const blob = await response.blob();
          zip.file(file.relativePath, blob);
        })
      );
    }

    button.textContent = "Comprimiendo...";

    const zipBlob = await zip.generateAsync(
      {
        type: "blob",
        compression: "DEFLATE",
        compressionOptions: { level: 6 }
      },
      metadata => {
        button.textContent = `Comprimiendo ${Math.round(metadata.percent)}%...`;
      }
    );

    const url = URL.createObjectURL(zipBlob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `${directory.name}.zip`;
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 2000);

  } catch (error) {
    console.error(error);
    alert("No se pudo descargar la carpeta:\n\n" + error.message);
  } finally {
    button.disabled = false;
    button.textContent = originalText;
  }
}

function createCard(directory) {
  const card = document.createElement("article");
  card.className = "directory";

  card.innerHTML = `
    <div class="folder">
      <div class="folder-icon">📁</div>
      <div class="folder-info">
        <div class="folder-name">${escapeHTML(directory.name || "Sin nombre")}</div>
        <div class="folder-path">/${escapeHTML(directory.path || "")}</div>
      </div>
    </div>

    <div class="info">
      <div class="info-box">
        <div class="label">Estado</div>
        <div class="value">Disponible</div>
      </div>

      <div class="info-box">
        <div class="label">Peso</div>
        <div class="value">${formatBytes(directory.size)}</div>
      </div>

      <div class="info-box">
        <div class="label">Archivos</div>
        <div class="value">${directory.fileCount || 0}</div>
      </div>

      <div class="info-box">
        <div class="label">Versión</div>
        <div class="value">${escapeHTML(directory.version || "1.0")}</div>
      </div>
    </div>

    <button class="download" type="button">
      ↓ Descargar carpeta
    </button>
  `;

  const button = card.querySelector(".download");
  button.addEventListener("click", event => {
    downloadFolder(event, directory);
  });

  return card;
}

function showError(error) {
  statusText.textContent = "Error";
  statusContainer.classList.add("error");

  container.innerHTML = `
    <div class="error">
      <h2>No se pudo cargar el catálogo</h2>
      <p>${escapeHTML(error.message)}</p>
      <p style="margin-top:15px">Comprueba que manifest.json exista en la raíz del sitio.</p>
    </div>
  `;
}

async function init() {
  try {
    const manifest = await loadManifest();
    const directories = manifest.directories || [];

    if (!directories.length) {
      container.innerHTML = `
        <div class="empty">
          <h2>No hay carpetas disponibles</h2>
          <p style="margin-top:10px">El repositorio no contiene directorios publicables.</p>
        </div>
      `;
      statusText.textContent = "0 directorios encontrados";
      return;
    }

    statusText.textContent = `${directories.length} directorios encontrados`;
    container.innerHTML = "";

    for (const directory of directories) {
      container.appendChild(createCard(directory));
    }

  } catch (error) {
    console.error(error);
    showError(error);
  }
}

init();
</script>

</body>
</html>
